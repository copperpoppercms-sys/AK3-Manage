name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned official Luau interpreter for behavior tests
        run: |
          curl --fail --location --retry 2 https://github.com/luau-lang/luau/releases/download/0.743/luau-ubuntu.zip -o "$RUNNER_TEMP/luau.zip"
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/luau"
      - run: python -m unittest discover -s tests -v
        env:
          LUAU_BIN: ${{ runner.temp }}/luau/luau
      - name: Check a real public GitHub script link
        run: |
          python - <<'PY'
          import asyncio
          from bastion.inputs import fetch_script
          async def main():
              data = await fetch_script('https://github.com/luau-lang/luau/blob/0.743/tests/conformance/basic.luau')
              assert len(data) > 1000 and b'local' in data
              print('Public script link downloaded:', len(data), 'bytes')
          asyncio.run(main())
          PY
